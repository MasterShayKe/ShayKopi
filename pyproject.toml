[project]
name = "shaykopi"
version = "0.1.0"
description = "Card inventory & deal monitor for Pokemon TCG and One Piece TCG across eBay, Hobbiesville, GameNerds, and TCGPlayer."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "discord-webhook>=1.3",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
shaykopi = "shaykopi.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shaykopi*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"shaykopi/cli.py" = ["B008"]  # typer.Option(...) defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
